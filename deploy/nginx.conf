# Ayla Musk — nginx reverse proxy
#
# Installed to /etc/nginx/sites-available/aylamusk by deploy/setup.sh and
# symlinked into sites-enabled. `__SERVER_NAME__` is replaced at install time
# with the value of PUBLIC_HOST from /etc/aylamusk.env.
#
#   /            -> Next.js   (127.0.0.1:3000)
#   /api/, /health -> Express (127.0.0.1:4000)

upstream aylamusk_web { server 127.0.0.1:3000; keepalive 16; }
upstream aylamusk_api { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 10m;

    # gzip
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://aylamusk_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /health {
        proxy_pass http://aylamusk_api;
        proxy_set_header Host $host;
    }

    # Next.js static build assets — let them be cached hard
    location /_next/static/ {
        proxy_pass http://aylamusk_web;
        proxy_set_header Host $host;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://aylamusk_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
